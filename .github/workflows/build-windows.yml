name: Build Windows desktop app

# Builds the packaged exe (desktop/dmx_controller.spec) on a real Windows
# runner and smoke-tests it. This exists because the exe can't be built or
# run from the Linux sandbox development happens in -- this is the only
# automated check of the PyInstaller bundling (sounddevice's PortAudio DLL,
# uvicorn's dynamically-loaded protocol backends, frontend/profile data)
# short of building it by hand on a real Windows machine. It does NOT
# verify the pywebview window or tray icon actually look right -- only that
# the exe launches and the backend inside it answers.

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "backend/**"
      - "frontend/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r desktop/requirements.txt

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Desktop lifecycle tests (no GUI deps)
        run: python -m pytest desktop/tests -q

      - name: Build exe with PyInstaller
        run: pyinstaller desktop/dmx_controller.spec

      - name: Verify build output exists
        shell: pwsh
        run: |
          $exe = "dist/DMX Controller/DMX Controller.exe"
          if (-not (Test-Path $exe)) {
            throw "Build did not produce $exe"
          }
          Write-Host "Built: $exe"

      - name: Smoke test -- launch the exe and confirm the backend answers
        shell: pwsh
        run: |
          $exe = "dist/DMX Controller/DMX Controller.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/room" -UseBasicParsing -TimeoutSec 2
              if ($resp.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          if (-not $ready) {
            throw "Packaged exe never answered http://127.0.0.1:8000/api/room within 30s"
          }
          Write-Host "Smoke test passed."

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmx-controller-windows
          path: dist/DMX Controller/
          if-no-files-found: warn
